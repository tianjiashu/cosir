name: terminal-worker-bundle

on:
  push:
    paths:
      - "apps/terminal-worker/**"
      - "apps/desktop/scripts/**"
      - "apps/desktop/src-tauri/tauri.conf.json"
      - "apps/desktop/package.json"
      - ".github/workflows/terminal-worker-bundle.yml"
  pull_request:
    paths:
      - "apps/terminal-worker/**"
      - "apps/desktop/scripts/**"
      - "apps/desktop/src-tauri/tauri.conf.json"
      - "apps/desktop/package.json"
      - ".github/workflows/terminal-worker-bundle.yml"
  workflow_dispatch:

jobs:
  stage-and-smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macos-x86_64
            runner: macos-13
            target: x86_64-apple-darwin
          - name: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install desktop dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2'

      - name: Stage release Worker
        run: npm run stage:terminal-worker
        working-directory: apps/desktop
        env:
          COSIR_TERMINAL_WORKER_TARGET: ${{ matrix.target }}

      - name: Verify staged bundle resource and startup
        run: npm run test:terminal-worker-bundle
        working-directory: apps/desktop

      - name: Build desktop installer
        run: npm run tauri:build -- --no-sign --ci
        working-directory: apps/desktop
        env:
          COSIR_TERMINAL_WORKER_TARGET: ${{ matrix.target }}

      - name: Verify packaged resource and startup
        run: npm run test:terminal-worker-bundle
        working-directory: apps/desktop
        env:
          COSIR_TERMINAL_VERIFY_PACKAGED: "true"
          COSIR_TERMINAL_WORKER_TARGET: ${{ matrix.target }}
