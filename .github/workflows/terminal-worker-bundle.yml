name: terminal-worker-bundle

on:
  push:
    branches:
      - "main"
    paths:
      - "apps/desktop/**"
      - "apps/terminal-worker/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/terminal-worker-bundle.yml"
  pull_request:
    branches:
      - "main"
    paths:
      - "apps/desktop/**"
      - "apps/terminal-worker/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/terminal-worker-bundle.yml"
  workflow_dispatch:

jobs:
  stage-and-smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install desktop dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Stage release Worker
        run: npm run stage:terminal-worker
        working-directory: apps/desktop
        env:
          COSIR_TERMINAL_WORKER_TARGET: ${{ matrix.target }}

      - name: Verify staged bundle resource and startup
        run: npm run test:terminal-worker-bundle
        working-directory: apps/desktop

