name: desktop-host

# 桌面宿主在各平台上的进程与终端行为：宿主存活契约、进程树清理、Terminal Worker、交互终端、会话临时目录、
# stdio MCP 服务，以及真实宿主的 E2E 与启动入口。同一份用例跑三个平台，平台专属的用例各自按平台 skip。
#
# - Windows、macOS：全套。Windows 的跑机是 Windows Server（不是 10/11 桌面版），有 Defender、没有真人：
#   Windows 10 的 ConPTY 重排、剪贴板与窗口外观仍要真机看；窗口外框只产出截图（artifact），由人判断。
# - Linux：只跑 Worker 与后端。Linux 不是发布平台，跑它是为了 Worker 里 Linux 专有的进程查找（读 /proc）与
#   POSIX 路径；桌面 E2E 要 xvfb、标题栏也是另一条原生路径，收益抵不上成本。
#
# 不跑后端全量：Windows 全量里大量默认 Unix 的写法会一次报出一大片，淹没真正的回归。扩大范围时把新测试加进
# 对应 job，并先在各平台清到绿。

on:
  push:
    branches:
      - "main"
    paths:
      - "apps/terminal-worker/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/backend/app/parent_watch.py"
      - "apps/backend/app/__main__.py"
      - "apps/backend/app/lifespan.py"
      - "apps/backend/app/service/session/session_scratch.py"
      - "apps/backend/app/tools/terminal_runtime/**"
      - "apps/backend/app/tools/tool_handler/terminal/**"
      - "apps/backend/app/tools/shell/**"
      - "apps/backend/app/tools/tool_models/terminal/**"
      - "apps/backend/app/tools/display/terminal_display.py"
      - "apps/backend/app/core/tool/execute/tool_terminal_projection.py"
      - "apps/backend/app/assistant_transport/state/conversation_state_terminal_session.py"
      - "apps/backend/app/api/terminal_sessions_api.py"
      - "apps/backend/app/api/terminal_stream_api.py"
      - "apps/backend/app/service/terminal/**"
      - "apps/backend/app/tools/mcp/**"
      - "apps/backend/tests/test_parent_watch.py"
      - "apps/backend/tests/test_session_scratch.py"
      - "apps/backend/tests/test_terminal_*.py"
      - "apps/backend/tests/test_execute_terminal_*.py"
      - "apps/backend/tests/test_local_backend_*.py"
      - "apps/backend/tests/test_tool_terminal_*.py"
      - "apps/backend/tests/test_backend_host_exit.py"
      - "apps/backend/tests/test_mcp_connection_pool.py"
      - "apps/backend/tests/terminal_test_support.py"
      - "apps/backend/tests/process_tree_support.py"
      - "apps/desktop/electron/**"
      - "apps/desktop/lib/platform.ts"
      - "apps/desktop/styles/globals.css"
      - "apps/desktop/scripts/**"
      - "apps/desktop/tests/desktop-e2e/**"
      - "apps/desktop/tests/unit/backend-*.test.ts"
      - "scripts/start-desktop.ps1"
      - "scripts/start-desktop.sh"
      - ".github/workflows/desktop-host.yml"
  pull_request:
    branches:
      - "main"
    paths:
      - "apps/terminal-worker/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/backend/app/parent_watch.py"
      - "apps/backend/app/__main__.py"
      - "apps/backend/app/lifespan.py"
      - "apps/backend/app/service/session/session_scratch.py"
      - "apps/backend/app/tools/terminal_runtime/**"
      - "apps/backend/app/tools/tool_handler/terminal/**"
      - "apps/backend/app/tools/shell/**"
      - "apps/backend/app/tools/tool_models/terminal/**"
      - "apps/backend/app/tools/display/terminal_display.py"
      - "apps/backend/app/core/tool/execute/tool_terminal_projection.py"
      - "apps/backend/app/assistant_transport/state/conversation_state_terminal_session.py"
      - "apps/backend/app/api/terminal_sessions_api.py"
      - "apps/backend/app/api/terminal_stream_api.py"
      - "apps/backend/app/service/terminal/**"
      - "apps/backend/app/tools/mcp/**"
      - "apps/backend/tests/test_parent_watch.py"
      - "apps/backend/tests/test_session_scratch.py"
      - "apps/backend/tests/test_terminal_*.py"
      - "apps/backend/tests/test_execute_terminal_*.py"
      - "apps/backend/tests/test_local_backend_*.py"
      - "apps/backend/tests/test_tool_terminal_*.py"
      - "apps/backend/tests/test_backend_host_exit.py"
      - "apps/backend/tests/test_mcp_connection_pool.py"
      - "apps/backend/tests/terminal_test_support.py"
      - "apps/backend/tests/process_tree_support.py"
      - "apps/desktop/electron/**"
      - "apps/desktop/lib/platform.ts"
      - "apps/desktop/styles/globals.css"
      - "apps/desktop/scripts/**"
      - "apps/desktop/tests/desktop-e2e/**"
      - "apps/desktop/tests/unit/backend-*.test.ts"
      - "scripts/start-desktop.ps1"
      - "scripts/start-desktop.sh"
      - ".github/workflows/desktop-host.yml"
  workflow_dispatch:

jobs:
  worker:
    name: terminal worker (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcap-dev pkg-config

      # 进程归属（Windows Job Object / POSIX 进程组与会话）各平台各有实现，都要在自己的平台上跑。
      - name: Cargo test
        run: cargo test --package cosir-terminal-worker

  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable

      # zsh 用例要求装了 zsh。Ubuntu 的 /etc/zsh/zshrc 会跑 compinit：跑机镜像里有组/他人可写的补全目录时它会停在
      # 「忽略不安全目录？」的提问上，集成脚本永远发不出 ready。按 compaudit（compinit 用的同一判定）收回写权限，
      # 修不干净就在这一步失败，而不是变成用例超时。macOS 自带 zsh。
      - name: Install zsh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh libcap-dev pkg-config
          audit() { zsh -fc 'autoload -U compaudit; compaudit' 2>/dev/null || true; }
          insecure=$(audit)
          echo "compaudit 不安全目录：${insecure:-无}"
          [ -z "$insecure" ] || echo "$insecure" | xargs sudo chmod g-w,o-w
          remaining=$(audit)
          [ -z "$remaining" ] || { echo "compaudit 仍报告不安全目录：$remaining"; exit 1; }

      # 真进程用例回落到 target/debug 的 worker。
      - name: Build Terminal Worker
        run: cargo build --package cosir-terminal-worker

      - name: Install backend dependencies
        working-directory: apps/backend
        run: uv sync --frozen

      # bash：pytest 不展开通配符，Windows 默认的 pwsh 也不展开。Linux 不在后端的默认数据根平台里，直跑后端须显式
      # 注入数据根；其余平台一样注入，免得写进跑机用户的主目录。
      - name: Pytest (desktop host scope)
        working-directory: apps/backend
        shell: bash
        env:
          CODING_AGENT_DATA_DIR: ${{ runner.temp }}/cosir-data
        run: |
          uv run pytest -q -rs \
            tests/test_parent_watch.py \
            tests/test_backend_host_exit.py \
            tests/test_session_scratch.py \
            tests/test_mcp_connection_pool.py \
            tests/test_terminal_*.py \
            tests/test_execute_terminal_*.py \
            tests/test_local_backend_*.py \
            tests/test_tool_terminal_*.py

  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            npm: npm.cmd
            start_script: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ../../scripts/start-desktop.ps1 -NoElevation
          - os: macos-latest
            npm: npm
            start_script: bash ../../scripts/start-desktop.sh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable

      # 桌面 E2E 与启动入口拉起真实后端：用它的虚拟环境，宿主不必在全新缓存里再同步一次。
      - name: Install backend dependencies
        working-directory: apps/backend
        run: uv sync --frozen

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      # Windows 跑机默认 1024×768：窗口被压到 1024 宽以内，应用按窄屏把侧栏收成抽屉（`app-layout.tsx` 的
      # NARROW_VIEWPORT_QUERY），用例找不到侧栏；用户的屏幕不会这么小。
      - name: Set display resolution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-CimInstance Win32_VideoController | Select-Object CurrentHorizontalResolution, CurrentVerticalResolution

      - name: Unit tests (host process rules)
        working-directory: apps/desktop
        run: npx vitest run tests/unit/backend-process.test.ts tests/unit/backend-supervisor.test.ts tests/unit/backend-transitions.test.ts

      # 宿主的进程与窗口行为（窗口外框截图只在 Windows）：这是本门禁覆盖的范围。以下各步互不依赖，前一步失败也照跑。
      - name: Desktop E2E (host)
        if: success() || failure()
        working-directory: apps/desktop
        run: npm run build && npx playwright test -c playwright.desktop.config.ts desktop-smoke window-frame terminal-permissions local-control-identity

      # 内置浏览器引擎在 Windows 上仍有未查清的失败（未摆上面板的标签 Page.captureScreenshot 无响应、iframe 点击与
      # body 滚动结果不同），不在本门禁的待办范围内：Windows 上照跑并保留产物、但不挡合并，查清后去掉 continue-on-error。
      - name: Desktop E2E (browser engine)
        if: success() || failure()
        continue-on-error: ${{ runner.os == 'Windows' }}
        working-directory: apps/desktop
        run: npx playwright test -c playwright.desktop.config.ts browser-engine --output test-results-browser

      # 开发入口与一键启动脚本：等到后端 ready，再只强杀 Electron 主进程（模拟宿主崩溃），后端须经宿主存活
      # 契约自行优雅退出（bootstate 落到 stopped）。
      - name: Launch smoke (npm run electron:dev)
        if: success() || failure()
        working-directory: apps/desktop
        run: node scripts/verify-desktop-launch.mjs ${{ matrix.npm }} run electron:dev

      - name: Launch smoke (start-desktop script)
        if: success() || failure()
        working-directory: apps/desktop
        run: node scripts/verify-desktop-launch.mjs ${{ matrix.start_script }}

      - name: Upload desktop artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts-${{ matrix.os }}
          path: |
            apps/desktop/test-results
            apps/desktop/test-results-browser
          if-no-files-found: ignore
