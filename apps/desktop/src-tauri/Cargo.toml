[package]
name = "cosir-desktop"
version = "0.1.0"
description = "Cosir local desktop Agent shell"
authors = ["Cosir"]
edition = "2021"

[features]
default = []
desktop-e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[lib]
name = "cosir_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-single-instance = "2"
tauri-plugin-wdio = { version = "1.4.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61", features = ["Win32_Foundation"] }
