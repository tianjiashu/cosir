[package]
name = "coding-agent-desktop"
version = "0.1.0"
description = "Coding Agent - 本地桌面 AI 开发伙伴"
authors = ["coding-agent"]
edition = "2021"

[lib]
name = "coding_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
reqwest = { version = "0.12.5", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4.38", default-features = true, features = ["clock"] }
tokio = { version = "1", features = ["time", "macros", "rt"] }

# Windows MSVC 链接器对 dev PDB 有体积上限（LNK1318 LIMIT），
# 完整调试信息会让 coding-agent-desktop 链接失败。dev 构建只保留行号表，
# 足以断点调试，PDB 体积骤减；不影响 release 构建。
[profile.dev]
debug = "line-tables-only"
