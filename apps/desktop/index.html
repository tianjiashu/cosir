<!doctype html>
<html lang="zh-CN" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Cosir</title>
    <script>
      // 首帧先应用用户选择；system 或首次启动时回退到系统外观。
      // storage key 与 lib/theme/theme-preference.ts 的 STORAGE_KEY 保持一致。
      var preference = "system";
      try {
        var storedPreference = window.localStorage.getItem("cosir.theme-preference");
        if (storedPreference === "light" || storedPreference === "dark" || storedPreference === "system") {
          preference = storedPreference;
        }
      } catch (_) {}
      var dark = preference === "dark" || (preference === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) {
        document.documentElement.classList.add("dark");
      }
      document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0a0a0a" : "#ffffff");
    </script>
  </head>
  <body class="min-h-full flex flex-col">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
