[package]
name = "cosir-terminal-worker"
version = "0.1.0"
description = "Cosir local PTY terminal worker"
authors = ["Cosir"]
edition = "2021"

[[bin]]
name = "terminal-worker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
