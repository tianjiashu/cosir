# Strict mypy baseline used by the pre-commit "mypy-new-strict" hook.
#
# Difference vs [tool.mypy] in apps/backend/pyproject.toml:
#   - pyproject.toml declares strict = true as the vision, but temporarily
#     exempts legacy code via [[tool.mypy.overrides]] module = ["app.*"].
#   - This file has NO exemptions: new business code must fully satisfy strict
#     typing, otherwise the commit is blocked by the hook.
#
# NOTE: keep this file ASCII-only. mypy parses .ini with configparser using the
# system locale encoding (GBK on Chinese Windows); non-ASCII comments crash it.
# Keep the "strong typing baseline" section in rules/ and the hook description
# in .pre-commit-config.yaml in sync when editing this file.
[mypy]
python_version = 3.11
strict = true
# warn_unreachable is not included in strict; added explicitly
warn_unreachable = true
# third-party dynamic libs (langfuse/pydantic)
# Note: keep inline comments OFF this file - configparser (system locale)
# parses everything after the key as the value.
ignore_missing_imports = true
