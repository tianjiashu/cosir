# 强制规范：提交前自动格式化 + lint + 类型检查。
# 安装：uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        # 渐进式：mypy 先非阻塞（仅提示不报错），避免存量未注解代码堵死提交。
        # 待存量逐步补全注解后，移除 continue-on-error 升级为强制。
        continue-on-error: true
        additional_dependencies: []
        files: ^app/
